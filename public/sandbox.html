<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox</title>
  <!-- Content Security Policy: Inline script sets appropriate CSP based on environment -->
  <script>
    // Detect if running in development (Vite dev server on port 5173) or production
    const isDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173'
    
    // Development CSP: Allow localhost resources for the pre-bundled sandbox runtime.
    const devCSP = "default-src 'none'; script-src 'unsafe-inline' 'self' blob: http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:*; style-src 'unsafe-inline' 'self' http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:* https://cdn.nav.no; font-src 'self' https://cdn.nav.no data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* wss://localhost:* wss://127.0.0.1:*; img-src data: https:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none';"
    
    // Production CSP: strict, with user code limited to blob-backed modules.
    // Allow 'self' for the pre-bundled sandbox runtime and blob: for isolated user modules.
    const prodCSP = "default-src 'none'; script-src 'unsafe-inline' 'self' blob:; style-src 'unsafe-inline' 'self' https://cdn.nav.no; font-src https://cdn.nav.no data:; connect-src 'self'; img-src data: https:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none';"
    
    // Apply appropriate CSP
    const meta = document.createElement('meta')
    meta.httpEquiv = 'Content-Security-Policy'
    meta.content = isDev ? devCSP : prodCSP
    document.head.appendChild(meta)
    
    console.log('🔒 CSP applied:', isDev ? 'Development' : 'Production')
  </script>
  <!-- Aksel CSS: Bundled by esbuild in production, loaded via Vite in dev -->
  <link rel="stylesheet" href="./sandbox-bundle.css">
  <style>
    /* Set iframe canvas color to match preview container background */
    html {
      /* Color-scheme will be set dynamically by updateTheme function */
      /* Initial: dark (matches main app default) */
      color-scheme: dark;
      /* Use Aksel default background variable (adapts to theme) */
      background: var(--ax-bg-default);
      /* Enable scrolling when content overflows */
      overflow: auto;
      height: 100%;
    }
    
    body {
      background: transparent !important;
      width: 100%;
      min-height: 100%;
    }
    
    /* NO custom reset - Aksel CSS provides the complete reset via import */
    #root {
      width: 100%;
      box-sizing: border-box;
    }
    #root.light {
      color-scheme: light;
    }
    #root.dark {
      color-scheme: dark;
    }
    
    /* FIX: Theme component should fill root width */
    #root > .aksel-theme {
      background: transparent !important;
      width: 100%;
    }
    
    /* FIX: Missing Aksel textColor decoration variant */
    /* These CSS classes are used by Heading, BodyLong, BodyShort, Label, Detail, etc. */
    /* The CSS variable exists (--ax-text-decoration) but this class is not emitted by Aksel v8. */
    .aksel-typo--color-decoration {
      color: var(--ax-text-neutral-decoration);
    }
    
    .aksel-typo--color-decoration[data-color] {
      color: var(--ax-text-decoration);
    }
    
    .aksel-typo--color-contrast {
      color: var(--ax-text-neutral-contrast);
    }
    
    .aksel-typo--color-contrast[data-color] {
      color: var(--ax-text-contrast);
    }
    
    /* Scrollbar Styling - Match main app */
    /* Webkit browsers (Chrome, Safari, Edge) */
    ::-webkit-scrollbar {
      width: 8px; /* thin scrollbar */
      height: 8px; /* thin scrollbar */
      background: transparent;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ax-text-neutral-decoration);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ax-text-neutral-decoration);
      opacity: 0.8;
    }

    /* Firefox */
    * {
      scrollbar-color: var(--ax-text-neutral-decoration) transparent;
      scrollbar-width: thin;
    }
    
    /* CRITICAL FIX: Force Alert text to use correct color in light mode */
    /* Aksel Alert component should handle this, but explicitly ensure it */
    html.light .aksel-alert,
    html.light .aksel-alert .aksel-body-long,
    html.light .aksel-alert .aksel-alert__wrapper {
      color: var(--ax-text-neutral) !important;
    }
    
    html.dark .aksel-alert,
    html.dark .aksel-alert .aksel-body-long,
    html.dark .aksel-alert .aksel-alert__wrapper {
      color: var(--ax-text-neutral) !important;
    }
  </style>
</head>
<body>
  <!-- Apply aksel-theme and theme classes for Aksel styling to both html and root -->
  <!-- data-color activates the Aksel color system -->
  <script>
    // Set initial theme classes on html element for background (matches main app default: dark)
    document.documentElement.className = 'aksel-theme dark';
    document.documentElement.setAttribute('data-color', 'accent');
  </script>
  <div id="root" class="aksel-theme dark" data-color="accent"></div>
  
  <script src="./inspect-overlays-global.js"></script>
  <script src="./sandbox-messaging-global.js"></script>
  <script src="./preview-evidence-global.js"></script>
  <script>
  (() => {
    const {
      computeGapRects,
      computeSpacingOverlayRects,
      createOverlayElements,
      hideOverlays,
      parseSpacing,
      renderGapLayers,
      renderSpacingLayers,
    } = window.inspectOverlayUtils;
    const {
      postMessageToParent,
    } = window.sandboxMessaging;
    const {
      capturePreviewEvidenceSnapshot,
      isAnnotationTargetResolutionRequest,
      PREVIEW_EVIDENCE_ROOT_SELECTOR,
      resolveAnnotationTarget,
      runPreviewInteractionSequence,
    } = window.previewEvidenceUtils;

    // React and Aksel are loaded from the pre-bundled sandbox runtime.
    let currentRoot = null;
    let akselLoaded = false;
    let ThemeComponent = null;
    let lastComponent = null;
    let mainMessagePort = null;
    const reactRuntimeGlobalNames = new Set([
      'Fragment',
      'useState',
      'useEffect',
      'useContext',
      'useReducer',
      'useCallback',
      'useMemo',
      'useRef',
      'useImperativeHandle',
      'useLayoutEffect',
      'useDebugValue',
      'useId',
      'useTransition',
      'useDeferredValue',
      'useSyncExternalStore',
      'useInsertionEffect',
      'useActionState',
      'useOptimistic',
    ]);

    function exposeReactRuntimeGlobals(React) {
      window.Fragment = React.Fragment;
      window.useState = React.useState;
      window.useEffect = React.useEffect;
      window.useContext = React.useContext;
      window.useReducer = React.useReducer;
      window.useCallback = React.useCallback;
      window.useMemo = React.useMemo;
      window.useRef = React.useRef;
      window.useImperativeHandle = React.useImperativeHandle;
      window.useLayoutEffect = React.useLayoutEffect;
      window.useDebugValue = React.useDebugValue;
      window.useId = React.useId;
      window.useTransition = React.useTransition;
      window.useDeferredValue = React.useDeferredValue;
      window.useSyncExternalStore = React.useSyncExternalStore;
      window.useInsertionEffect = React.useInsertionEffect;
      window.useActionState = React.useActionState;
      window.useOptimistic = React.useOptimistic;
    }

    // Load Aksel + React - detect environment (Vite dev server runs on port 5173)
    const isDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173';

    console.log(`🔧 Environment: ${isDev ? 'Development' : 'Production'}`);
    
    // Function to load pre-bundled sandbox (production)
    // The sandbox bundle is pre-built with esbuild and loaded as IIFE
    async function loadFromBuild() {
      console.log('📦 Loading pre-bundled sandbox...');
      // Extract base path from current location
      // sandbox.html is at /aksel-arcade/sandbox.html
      // sandbox-bundle.js is at /aksel-arcade/sandbox-bundle.js
      const currentPath = window.location.pathname;
      const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      console.log('📍 Base path:', basePath);
      
      return new Promise((resolve, reject) => {
        // Check if already loaded
        if (window.sandboxBundle) {
          console.log('✅ Sandbox bundle already loaded from window.sandboxBundle');
          resolve(window.sandboxBundle);
          return;
        }
        
        // Load the pre-bundled sandbox script
        const script = document.createElement('script');
        script.src = basePath + 'sandbox-bundle.js';
        console.log('📥 Loading script from:', script.src);
        script.onload = () => {
          console.log('✅ Sandbox bundle loaded successfully');
          if (window.sandboxBundle) {
            console.log('✅ window.sandboxBundle found, keys:', Object.keys(window.sandboxBundle));
            resolve(window.sandboxBundle);
          } else {
            reject(new Error('sandboxBundle not found on window after script load'));
          }
        };
        script.onerror = (err) => {
          console.error('❌ Failed to load sandbox bundle:', err);
          reject(err);
        };
        document.head.appendChild(script);
      });
    }
    
    // Load the pre-bundled sandbox runtime. It is a classic script so it can run
    // inside an opaque sandbox origin without cross-origin module fetches.
    console.log('🚀 Starting module load, isDev:', isDev);
    console.log('🚀 Will call: loadFromBuild()');
    
    loadFromBuild()
      .then((module) => {
        console.log('✅ Module loaded successfully!');
        console.log('🔍 Module keys:', Object.keys(module || {}).slice(0, 15));
        
        // sandboxAksel.ts exports default object with all properties
        // In production, module.default is the sandbox object
        // In dev, Vite unwraps it so module IS the sandbox object
        const sandbox = module.default || module;
        console.log('🔍 sandbox.React:', !!sandbox.React, 'sandbox.createRoot:', !!sandbox.createRoot, 'sandbox.Theme:', !!sandbox.Theme);
        
        const { React, createRoot, Theme, AkselComponents, AkselIcons } = sandbox;
        
        // Make React available globally (same instance as Aksel uses)
        window.React = React;
        window.ReactDOM = { createRoot };
        
        // Make React hooks available globally (for user code)
        exposeReactRuntimeGlobals(React);
        
        // Store Theme component
        ThemeComponent = Theme;
        window.Theme = Theme;
        
        // Make all Aksel components available globally
        window.AkselDS = AkselComponents;
        Object.keys(AkselComponents).forEach(key => {
          if (reactRuntimeGlobalNames.has(key)) return;
          window[key] = AkselComponents[key];
        });
        
        // Make all Aksel icons available globally
        window.AkselIcons = AkselIcons;
        Object.keys(AkselIcons).forEach(key => {
          window[key] = AkselIcons[key];
        });
        
        akselLoaded = true;
        console.log('✅ Sandbox ready, Aksel + React loaded from Vite:', Object.keys(AkselComponents).length, 'components');
        console.log('✅ Aksel icons loaded:', Object.keys(AkselIcons).length, 'icons');
        console.log('✅ React version:', React.version);
        console.log('✅ Theme component available:', !!ThemeComponent);
        console.log('✅ Aksel CSS imported via @navikt/ds-css');
        announceSandboxReady();
      })
      .catch((err) => {
        console.error('❌❌❌ CRITICAL ERROR: Module loading failed completely!');
        console.error('❌ Error type:', err.name);
        console.error('❌ Error message:', err.message);
        console.error('❌ Full error:', err);
        console.error('❌ Stack:', err.stack);
        console.error('❌ Environment was:', isDev ? 'Development' : 'Production');
        
        // Send error to parent so it's visible in main app console
        try {
          sendError('RUNTIME_ERROR', {
            message: `Sandbox initialization failed: ${err.message}`,
            componentStack: null,
            stack: err.stack || '',
            pageId: getCurrentPreviewPageId()
          });
        } catch (postErr) {
          console.error('❌ Could not even send error to parent:', postErr);
        }
      });

    // Inspection state (T077)
    let inspectEnabled = false;
    let annotationModeEnabled = false;
    let annotationHoverOverlay = null;
    let annotationSelectionOverlay = null;
    let lastAnnotationHoverSignature = null;
    let lastAnnotationMoveTime = 0;
    let overlayElements = null;
    let lastInspectionData = null;
    let lastInspectionTime = 0;
    const INSPECTION_THROTTLE_MS = 16; // ~60fps
    
    // Theme state - matches main app default (dark)
    let currentTheme = 'dark';
    let currentRenderId = 0;
    let failedRenderId = null;
    let currentExecutionId = 0;
    const PREVIEW_RUNTIME_BRIDGE_KEY = '__AKSEL_ARCADE_PREVIEW_RUNTIME';
    const PREVIEW_PAGE_CHANGED_EVENT = '__AKSEL_ARCADE_PREVIEW_PAGE_CHANGED';
    let pendingNavigationPageId = null;

    function getPreviewRuntime() {
      const runtime = window[PREVIEW_RUNTIME_BRIDGE_KEY];
      if (
        !runtime ||
        typeof runtime.goToPage !== 'function' ||
        typeof runtime.hasPageId !== 'function'
      ) {
        return null;
      }

      return runtime;
    }

    function getCurrentPreviewPageId() {
      const runtime = getPreviewRuntime();
      return typeof runtime?.currentPageId === 'string' ? runtime.currentPageId : null;
    }

    function navigatePreviewToPage(pageId) {
      if (typeof pageId !== 'string' || pageId.length === 0) {
        return false;
      }

      if (getCurrentPreviewPageId() === pageId) {
        pendingNavigationPageId = null;
        return true;
      }

      pendingNavigationPageId = pageId;
      const runtime = getPreviewRuntime();
      if (!runtime) {
        return false;
      }

      if (!runtime.hasPageId(pageId)) {
        return false;
      }

      return runtime.goToPage(pageId);
    }

    function isBarePageIdTarget(target) {
      return /^page\d+$/.test(target);
    }

    function blockSandboxNavigation(message) {
      console.warn(message);
      sendError('RUNTIME_ERROR', {
        message,
        componentStack: null,
        stack: '',
        pageId: getCurrentPreviewPageId()
      });
    }

    function handleSandboxClickNavigation(event) {
      const anchor = event.target?.closest?.('a[href]');
      if (!anchor) {
        return;
      }

      const rawHref = anchor.getAttribute('href')?.trim() || '';
      if (!rawHref || rawHref.startsWith('#')) {
        event.preventDefault();
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      if (isBarePageIdTarget(rawHref)) {
        if (navigatePreviewToPage(rawHref)) {
          return;
        }

        blockSandboxNavigation(
          `Blocked Arcade page navigation to unknown page "${rawHref}". Re-read the manifest and use goToPage("pageNN") or a bare page id that exists.`
        );
        return;
      }

      blockSandboxNavigation(
        `Blocked browser navigation to "${rawHref}" inside the Preview sandbox. Use goToPage("pageNN") or an Aksel Link/LinkCard with a bare page id for Arcade page flow.`
      );
    }

    function handleSandboxSubmitNavigation(event) {
      if (event.defaultPrevented) {
        return;
      }

      const originalPreventDefault = event.preventDefault;
      let appPreventedDefault = false;
      let submitGuardPreventingDefault = true;

      const preventDefaultWithSubmitGuard = function (...args) {
        if (!submitGuardPreventingDefault) {
          appPreventedDefault = true;
        }

        return originalPreventDefault.apply(event, args);
      };
      event.preventDefault = preventDefaultWithSubmitGuard;

      originalPreventDefault.call(event);
      submitGuardPreventingDefault = false;

      window.setTimeout(() => {
        if (event.preventDefault === preventDefaultWithSubmitGuard) {
          event.preventDefault = originalPreventDefault;
        }

        if (appPreventedDefault) {
          return;
        }

        blockSandboxNavigation(
          'Blocked form submission inside the Preview sandbox. Handle form state in React and navigate with goToPage("pageNN") for Arcade page flow.'
        );
      }, 0);
    }

    document.addEventListener('click', handleSandboxClickNavigation, true);
    document.addEventListener('submit', handleSandboxSubmitNavigation);

    function flushPendingNavigation() {
      if (!pendingNavigationPageId) {
        return false;
      }

      const runtime = getPreviewRuntime();
      if (!runtime) {
        return false;
      }

      if (getCurrentPreviewPageId() === pendingNavigationPageId) {
        pendingNavigationPageId = null;
        return true;
      }

      if (!runtime.hasPageId(pendingNavigationPageId)) {
        return false;
      }

      return runtime.goToPage(pendingNavigationPageId);
    }

    window.addEventListener(PREVIEW_PAGE_CHANGED_EVENT, (event) => {
      const pageId = event.detail?.pageId;
      if (typeof pageId !== 'string' || pageId.length === 0) {
        return;
      }

      if (pendingNavigationPageId && pendingNavigationPageId !== pageId) {
        return;
      }

      pendingNavigationPageId = null;
      sendMessage('PREVIEW_PAGE_CHANGED', { pageId });
    });

    function announceSandboxReady() {
      const sendReadyMessage = () => postMessageToParent(window.parent, {
        type: 'SANDBOX_READY',
        payload: {
          href: window.location.href
        }
      }, window.location);

      if (document.readyState === 'complete') {
        window.setTimeout(sendReadyMessage, 0);
        return;
      }

      window.addEventListener('load', () => window.setTimeout(sendReadyMessage, 0), { once: true });
    }

    // Listen for messages from parent window
    window.addEventListener('message', (event) => {
      // Security: validate the controlling parent, including Electron file:// null origins.
      const hasTrustedParentOrigin =
        event.origin === window.location.origin ||
        (window.location.protocol === 'file:' && event.origin === 'null');

      if (event.source !== window.parent || !hasTrustedParentOrigin) {
        console.warn('❌ Rejected message from unauthorized origin:', event.origin);
        return;
      }
      
      if (event.data?.type === 'CONNECT_SANDBOX') {
        connectSandboxPort(event.ports?.[0]);
        return;
      }

      handleParentMessage(event.data);
    });

    function connectSandboxPort(port) {
      if (!port || mainMessagePort) {
        return;
      }

      mainMessagePort = port;
      mainMessagePort.onmessage = (event) => handleParentMessage(event.data);
      mainMessagePort.start?.();
      sendMessage('SANDBOX_CONNECTED', {});
    }

    function handleParentMessage(message) {
      // Validate message structure
      if (!message || typeof message !== 'object') return;

      console.log('📥 Sandbox received message:', message.type);

      try {
        switch (message.type) {
          case 'EXECUTE_CODE':
            console.log('🚀 Executing code...');
            executeCode(message.payload);
            break;
          case 'NAVIGATE_TO_PAGE':
            navigatePreviewToPage(message.payload?.pageId);
            break;
          case 'UPDATE_VIEWPORT':
            console.log('📐 Updating viewport...');
            updateViewport(message.payload);
            break;
          case 'TOGGLE_INSPECT':
            console.log('🔍 Toggling inspect mode...');
            toggleInspect(message.payload);
            break;
          case 'TOGGLE_ANNOTATION_MODE':
            console.log('💬 Toggling annotation mode...');
            toggleAnnotationMode(message.payload);
            break;
          case 'CLEAR_ANNOTATION_SELECTION':
            clearAnnotationSelectionOverlay();
            break;
          case 'UPDATE_THEME':
            console.log('🎨 Updating theme...');
            updateTheme(message.payload);
            break;
          case 'CAPTURE_PREVIEW_EVIDENCE':
            console.log('📸 Capturing Preview evidence...');
            capturePreviewEvidence(message.payload);
            break;
          case 'RESOLVE_ANNOTATION_TARGET':
            console.log('📍 Resolving annotation target...');
            resolveAnnotationTargetRequest(message.payload);
            break;
          case 'CHECK_CSS_VARS':
            checkCSSVariables(message.id);
            break;
          default:
            console.warn('Unknown message type:', message.type);
        }
      } catch (error) {
        console.error('❌ Message handling error:', error);
        sendError('RUNTIME_ERROR', {
          message: error.message,
          componentStack: null,
          stack: error.stack || '',
          pageId: getCurrentPreviewPageId()
        });
      }
    }

    async function capturePreviewEvidence(payload) {
      const requestId = payload?.requestId;
      if (typeof requestId !== 'string' || requestId.length === 0) {
        console.warn('Invalid Preview evidence request payload:', payload);
        return;
      }

      const expectedPageId =
        typeof payload?.expectedPageId === 'string' && payload.expectedPageId.length > 0
          ? payload.expectedPageId
          : null;
      const layers = Array.isArray(payload?.layers) ? payload.layers : undefined;
      const interactions = Array.isArray(payload?.interactions) ? payload.interactions : [];
      const screenshotScope =
        typeof payload?.screenshotScope === 'string' ? payload.screenshotScope : undefined;
      const viewportWidth =
        typeof payload?.viewportWidth === 'number' ? payload.viewportWidth : undefined;
      const viewportHeight =
        typeof payload?.viewportHeight === 'number' ? payload.viewportHeight : undefined;
      const target =
        payload?.target && typeof payload.target === 'object' ? payload.target : undefined;
      const maxFrames = 30;

      const captureWhenReady = async (remainingFrames = maxFrames) => {
        if (expectedPageId && getCurrentPreviewPageId() !== expectedPageId) {
          if (remainingFrames <= 0) {
            sendPreviewEvidenceResult(requestId, {
              ok: false,
              error: {
                code: 'render-timeout',
                message: `Preview did not reach page "${expectedPageId}" before capture timed out.`,
              },
            });
            return;
          }

          window.setTimeout(() => {
            void captureWhenReady(remainingFrames - 1);
          }, 16);
          return;
        }

        try {
          const root = document.querySelector(PREVIEW_EVIDENCE_ROOT_SELECTOR);
          if (!root) {
            sendPreviewEvidenceResult(requestId, {
              ok: false,
              error: {
                code: 'preview-unavailable',
                message: 'Preview root element was not found in the sandbox.',
              },
            });
            return;
          }

          await new Promise((resolve) => window.setTimeout(resolve, 32));

          const interactionResult = await runPreviewInteractionSequence(
            root,
            interactions,
            {
              currentPageId: getCurrentPreviewPageId(),
              getCurrentPageId: getCurrentPreviewPageId,
            },
            window
          );
          if (!interactionResult.ok) {
            sendPreviewEvidenceResult(requestId, interactionResult);
            return;
          }

          sendPreviewEvidenceResult(
            requestId,
            capturePreviewEvidenceSnapshot(
              root,
              {
                layers,
                screenshotScope,
                viewportFallback:
                  typeof viewportWidth === 'number' && typeof viewportHeight === 'number'
                    ? { width: viewportWidth, height: viewportHeight }
                    : undefined,
                target,
                currentPageId: getCurrentPreviewPageId(),
                interactionState: interactionResult.interactionState,
              },
              window
            )
          );
        } catch (error) {
          sendPreviewEvidenceResult(requestId, {
            ok: false,
            error: {
              code: 'preview-unavailable',
              message: `Preview evidence could not be captured: ${getErrorMessage(error)}`,
            },
          });
        }
      };

      await captureWhenReady();
    }

    function resolveAnnotationTargetRequest(payload) {
      const requestId = payload?.requestId;
      const request = payload?.request;
      if (
        typeof requestId !== 'string' ||
        requestId.length === 0 ||
        !isAnnotationTargetResolutionRequest(request)
      ) {
        console.warn('Invalid Annotation target request payload:', payload);
        return;
      }

      const root = document.querySelector(PREVIEW_EVIDENCE_ROOT_SELECTOR);
      if (!root) {
        sendAnnotationTargetResult(requestId, {
          status: 'dead',
          reason: 'no-match',
          matchCount: 0,
        });
        return;
      }

      sendAnnotationTargetResult(requestId, resolveAnnotationTarget(root, request, window));
    }

    function sendAnnotationTargetResult(requestId, result) {
      sendMessage('ANNOTATION_TARGET_RESOLVED', {
        requestId,
        result,
      });
    }

    function sendPreviewEvidenceResult(requestId, result) {
      sendMessage('PREVIEW_EVIDENCE_CAPTURED', {
        requestId,
        result,
      });
    }

    function toggleAnnotationMode(payload) {
      if (!payload || typeof payload.enabled !== 'boolean') {
        console.error('❌ Invalid payload for TOGGLE_ANNOTATION_MODE:', payload);
        return;
      }

      annotationModeEnabled = payload.enabled;
      if (annotationModeEnabled) {
        if (inspectEnabled) {
          toggleInspect({ enabled: false });
        }
        ensureAnnotationOverlayElements();
        document.addEventListener('mousemove', handleAnnotationMouseMove, true);
        document.addEventListener('click', handleAnnotationClick, true);
        document.documentElement.classList.add('aksel-arcade-annotation-mode');
      } else {
        document.removeEventListener('mousemove', handleAnnotationMouseMove, true);
        document.removeEventListener('click', handleAnnotationClick, true);
        document.documentElement.classList.remove('aksel-arcade-annotation-mode');
        clearAnnotationOverlays();
        sendMessage('ANNOTATION_TARGET_HOVERED', null);
      }
    }

    function ensureAnnotationOverlayElements() {

    function handleAnnotationMouseMove(event) {
      if (!annotationModeEnabled) {
        return;
      }

      const now = Date.now();
      if (now - lastAnnotationMoveTime < INSPECTION_THROTTLE_MS) {
        return;
      }
      lastAnnotationMoveTime = now;

      const target = resolveAnnotationPoint(event.clientX, event.clientY);
      if (!target || target.status !== 'resolved' || !target.target) {
        lastAnnotationHoverSignature = null;
        hideAnnotationOverlay(annotationHoverOverlay);
        sendMessage('ANNOTATION_TARGET_HOVERED', null);
        return;
      }

      const signature = target.target.identity.signature;
      renderAnnotationOverlay(annotationHoverOverlay, target.target);
      if (signature !== lastAnnotationHoverSignature) {
        lastAnnotationHoverSignature = signature;
        sendMessage('ANNOTATION_TARGET_HOVERED', target);
      }
    }

    function handleAnnotationClick(event) {
      if (!annotationModeEnabled) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();

      const target = resolveAnnotationPoint(event.clientX, event.clientY);
      if (!target || target.status !== 'resolved' || !target.target) {
        return;
      }

      renderAnnotationOverlay(annotationSelectionOverlay, target.target);
      sendMessage('ANNOTATION_TARGET_SELECTED', target);
    }

    function resolveAnnotationPoint(x, y) {
      const root = document.querySelector(PREVIEW_EVIDENCE_ROOT_SELECTOR);
      if (!root) {

      return resolveAnnotationTarget(root, { mode: 'point', x, y }, window);

      overlay.style.display = 'block';
      overlay.style.left = `${box.x}px`;
      overlay.style.top = `${top}px`;
      overlay.style.width = `${box.width}px`;
      overlay.style.height = `${box.height}px`;

    // T079: Handle mousemove during inspect mode (throttled to 60fps)
    function handleInspectMouseMove(event) {

        lastInspectionTime = now;

        const element = document.elementFromPoint(event.clientX, event.clientY);
        if (!element || element === document.body || element === document.documentElement) {
          clearInspectOverlays();
          sendMessage('INSPECTION_DATA', null);
          return;
        }

        // T078: Extract inspection data (includes cursor position)
        const inspectionData = extractInspectionData(element, event.clientX, event.clientY);

          fontSize: inspectionData.fontSize,
          hasProps: Object.keys(inspectionData.props || {}).length,
        });
        
        lastInspectionData = inspectionData;
        renderInspectOverlays(element, inspectionData);
        
        // T079: Send inspection data to main app
        sendMessage('INSPECTION_DATA', inspectionData);
      } catch (error) {
        console.error('❌ Error in handleInspectMouseMove:', error);
        // Don't send error to main app - just log and continue
        // This prevents inspect mode from breaking on edge cases
      }

    // T078: Extract component name, props, and computed styles
    function extractInspectionData(element, cursorX, cursorY) {
      try {
        const computedStyle = window.getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        const marginValues = {
          top: parseSpacing(computedStyle.marginTop),
          right: parseSpacing(computedStyle.marginRight),
          bottom: parseSpacing(computedStyle.marginBottom),
          left: parseSpacing(computedStyle.marginLeft),
        };
        const paddingValues = {
          top: parseSpacing(computedStyle.paddingTop),
          right: parseSpacing(computedStyle.paddingRight),
          bottom: parseSpacing(computedStyle.paddingBottom),
          left: parseSpacing(computedStyle.paddingLeft),
        };
        const layoutType = computedStyle.display || 'block';
        const flexDirection = computedStyle.flexDirection || 'row';
        const rowGap = parseSpacing(computedStyle.rowGap);
        const columnGap = parseSpacing(computedStyle.columnGap);
        const gapValue = computedStyle.gap || null;
        const gapApplicable = layoutType.includes('flex') || layoutType.includes('grid');
        
        // Try to find React component name from Fiber
        let componentName = element.tagName.toLowerCase();
        try {
          const fiberKey = Object.keys(element).find(key => key.startsWith('__reactFiber'));
          const fiber = fiberKey ? element[fiberKey] : null;
          const componentType = fiber?.type;
          
          if (componentType) {
            if (typeof componentType === 'function') {
              componentName = componentType.name || componentType.displayName || 'Anonymous';
            } else if (typeof componentType === 'string') {
              componentName = componentType;
            }
          }
        } catch (fiberError) {
          console.warn('Could not extract React Fiber info:', fiberError);
          // Continue with tagName as componentName
        }
        
        // Extract React props
        let props = {};
        try {
          const propsKey = Object.keys(element).find(key => key.startsWith('__reactProps'));
          const rawProps = propsKey ? element[propsKey] : {};
          props = sanitizeProps(rawProps);
        } catch (propsError) {
          console.warn('Could not extract React props:', propsError);
          // Continue with empty props
        }
        
        return {
          componentName,
          tagName: element.tagName.toLowerCase(),
          cssClass: element.className || '',
          props,
          color: computedStyle.color,
          fontFamily: computedStyle.fontFamily,
          fontSize: computedStyle.fontSize,
          margin: computedStyle.margin,
          padding: computedStyle.padding,
          marginValues,
          paddingValues,
          layoutType,
          flexDirection,
          rowGap,
          columnGap,
          gap: gapValue === 'normal' ? null : gapValue,
          gapApplicable,
          boundingRect: {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            top: rect.top,
            right: rect.right,
            bottom: rect.bottom,
            left: rect.left,
          },
          cursorX: cursorX,
          cursorY: cursorY,
        };
      } catch (error) {
        console.error('❌ Error in extractInspectionData:', error);
        // Return minimal safe data
        return {
          componentName: 'unknown',
          tagName: element.tagName.toLowerCase(),
          cssClass: '',
          props: {},
          color: '',
          fontFamily: '',
          fontSize: '',
          margin: '',
          padding: '',
          marginValues: { top: 0, right: 0, bottom: 0, left: 0 },
          paddingValues: { top: 0, right: 0, bottom: 0, left: 0 },
          layoutType: 'block',
          flexDirection: 'row',
          rowGap: 0,
          columnGap: 0,
          gap: null,
          gapApplicable: false,
          boundingRect: {
            x: 0, y: 0, width: 0, height: 0,
            top: 0, right: 0, bottom: 0, left: 0,
          },
          cursorX: 0,
          cursorY: 0,
        };
      }
    }

    // Remove non-serializable props (functions, circular refs)
    function sanitizeProps(props) {
      const sanitized = {};
      for (const [key, value] of Object.entries(props)) {
        if (typeof value !== 'function' && key !== 'children') {
          try {
            JSON.stringify(value); // Test serializability
            sanitized[key] = value;
          } catch {
            sanitized[key] = '[Non-serializable]';
          }
        }
      }
      return sanitized;
    }

    function renderInspectOverlays(element, inspectionData) {

        const viewportBounds = {
          left: 0,
          top: 0,
          right: window.innerWidth,
          bottom: window.innerHeight,
        };

        const spacingRects = computeSpacingOverlayRects({
          boundingRect: inspectionData.boundingRect,
          margin: inspectionData.marginValues,
          padding: inspectionData.paddingValues,
          viewport: viewportBounds,
        });

        renderSpacingLayers(overlayElements, spacingRects);

        const childrenRects = Array.from(element.children || []).map((child) =>
          child.getBoundingClientRect()
        );

        const gapRects = computeGapRects({
          layoutType: inspectionData.layoutType,
          flexDirection: inspectionData.flexDirection,
          rowGap: inspectionData.rowGap,
          columnGap: inspectionData.columnGap,
          childrenRects,
          containerRect: inspectionData.boundingRect,
          viewport: viewportBounds,
        });

        renderGapLayers(overlayElements, gapRects);
      } catch (error) {
        console.error('❌ Error in renderInspectOverlays:', error);

    }

    function checkCSSVariables(messageId) {
      const root = document.getElementById('root');
      const button = document.querySelector('button');
      const rootStyles = root ? getComputedStyle(root) : null;
      const buttonStyles = button ? getComputedStyle(button) : null;
      
      // Get ALL CSS custom properties
      const allCSSVars = [];
      if (rootStyles) {
        for (let i = 0; i < rootStyles.length; i++) {
          const prop = rootStyles[i];
          if (prop.startsWith('--')) {
            allCSSVars.push(prop);
          }
        }
      }
      
      // Check specifically for --ax and --a prefixes
      const axVars = allCSSVars.filter(v => v.startsWith('--ax'));
      const aVars = allCSSVars.filter(v => v.startsWith('--a-') || v.startsWith('--a_'));
      
      // Get button attributes
      const buttonAttrs = {};
      if (button) {
        for (let attr of button.attributes) {
          buttonAttrs[attr.name] = attr.value;
        }
      }
      
      const result = {
        id: messageId,
        result: {
          rootClasses: root?.className,
          buttonClasses: button?.className,
          buttonAttributes: buttonAttrs,
          buttonExists: !!button,
          buttonBg: buttonStyles?.backgroundColor,
          buttonPadding: buttonStyles?.padding,
          buttonFontSize: buttonStyles?.fontSize,
          buttonFontFamily: buttonStyles?.fontFamily,
          totalCSSVars: allCSSVars.length,
          axVarCount: axVars.length,
          aVarCount: aVars.length,
          axVarSample: axVars.slice(0, 5),
          aVarSample: aVars.slice(0, 5),
          akselCSSLoaded: !!document.querySelector('link[href*="sandbox-bundle.css"], style[data-aksel-css]'),
          allStylesheets: Array.from(document.styleSheets).map(s => s.href).filter(Boolean)

    function createRenderErrorBoundary(renderId) {
      return class RenderErrorBoundary extends React.Component {
        constructor(props) {

        static getDerivedStateFromError() {
          return { hasError: true };
        }

        componentDidCatch(error, errorInfo) {
          failedRenderId = renderId;
          console.error('❌ React render error:', error);
          sendError('RUNTIME_ERROR', {
            message: getErrorMessage(error),
            componentStack: errorInfo?.componentStack || extractComponentStack(error),
            stack: getErrorStack(error),
            pageId: getCurrentPreviewPageId()
          });
        }

        render() {
          return this.state.hasError ? null : this.props.children;
        }
      };
    }

            console.log('✅ Render success');

    function extractLineNumber(error) {
      const match = error.stack?.match(/:(\d+):\d+/);
      return match ? parseInt(match[1], 10) - 1 : null; // 0-indexed
    }

    function extractComponentStack(error) {
      // Try to extract React component stack if available
      if (error.componentStack) {
        return error.componentStack;
      }
      return null;
    }

    function getErrorMessage(error) {
      return error && typeof error.message === 'string' ? error.message : String(error);
    }

    function getErrorStack(error) {
      return error && typeof error.stack === 'string' ? error.stack : '';
    }

    // Proxy console methods to send to parent
    const originalConsole = {
      log: console.log,
      warn: console.warn,
      error: console.error,
      info: console.info
    };

    ['log', 'warn', 'error', 'info'].forEach(level => {
      console[level] = (...args) => {
        originalConsole[level](...args);
        sendMessage('CONSOLE_LOG', {
          level,
          args: args.map(arg => {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch {
              return String(arg);
            }
          })
        });
      };
    });
  })();
  </script>
</body>
</html>
