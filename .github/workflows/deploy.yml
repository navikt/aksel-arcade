name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine app version
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          VERSION="$(
          node - <<'NODE'
          const { execSync } = require("node:child_process");
          const {
            readReleaseCandidateState,
            resolveStableDesktopVersion,
          } = require("./scripts/desktop-release-plan.cjs");

          const releaseTags = execSync('git tag --list "desktop-v*"', {
            encoding: "utf8",
            stdio: ["ignore", "pipe", "ignore"],
          })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          const { targetVersion } = readReleaseCandidateState();

          process.stdout.write(
            resolveStableDesktopVersion({
              releaseTags,
              targetVersion,
            }),
          );
          NODE
          )"
          echo "AKSEL_ARCADE_DESKTOP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
