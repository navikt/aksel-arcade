openapi: 3.1.0
info:
  title: Share Link Virtual API
  version: 0.1.0
  description: >-
    Virtual contract describing the client-side Share workflow. The operations are
    executed entirely in the browser but modeled as REST endpoints to keep
    requirements testable and technology-agnostic.
servers:
  - url: https://local.app/share
paths:
  /share-links:
    post:
      summary: Generate a shareable URL for the current project snapshot
      operationId: generateShareLink
      description: >-
        Captures the active ProjectSnapshot, evaluates multiple compression pipelines,
        and returns a tamper-detecting URL. The browser implementation MUST enforce
        a warn-at-3,600 / stop-at-4,000 character policy while surfacing status updates
        (loading, apology text after 9s, oversize fallback) and logging the chosen strategy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSnapshot'
      responses:
        '201':
          description: Share link generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - shareUrl
                  - approxChars
                  - checksum
                  - strategyId
                  - warningThresholdHit
                properties:
                  shareUrl:
                    type: string
                    description: Fully-qualified URL with `?share=` query parameter.
                  approxChars:
                    type: integer
                    description: Character count used for telemetry and oversize warnings.
                  checksum:
                    type: string
                    description: Base64url SHA-256 digest embedded in the URL for tamper detection.
                  strategyId:
                    type: string
                    enum: [lz-string-uri, fflate-deflate-b91, lzma-worker-b64url, brotli-wasm-b64url, ast-minify-lz-string]
                    description: Compression pipeline identifier used for this payload.
                  warningThresholdHit:
                    type: boolean
                    description: Indicates whether the payload crossed 3,600 characters while staying <=4,000.
        '413':
          description: Snapshot too large to encode under 4,000 characters across all strategies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OversizeError'
        '429':
          description: Duplicate generation already running; caller should reuse the pending result.
        '500':
          description: Compression or hashing failed; UI must show error + retry.
  /share-links/{token}:
    get:
      summary: Decode a share token and hydrate the editor
      operationId: decodeShareLink
      description: >-
        Parses the `share` query parameter token, verifies checksum, and returns
        the decoded ProjectSnapshot that replaces the local workspace after
        showing a confirmation to the recipient.
      parameters:
        - name: token
          in: path
          required: true
          description: Encoded token following `version.checksum.payload` convention.
          schema:
            type: string
      responses:
        '200':
          description: Token decoded successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - snapshot
                  - checksumValid
                  - strategyId
                properties:
                  snapshot:
                    $ref: '#/components/schemas/ProjectSnapshot'
                  checksumValid:
                    type: boolean
                    description: Indicates whether the recomputed checksum matched the embedded one.
                  strategyId:
                    type: string
                    description: Echoes the compression strategy encoded in the token so the client can select the correct decoder.
        '400':
          description: Token malformed or unsupported version.
        '409':
          description: Recipient has unsaved work and rejected the replacement flow.
        '422':
          description: Payload corrupt or checksum mismatch; client must show friendly error.
components:
  schemas:
    ProjectSnapshot:
      type: object
      required:
        - version
        - files
        - activeFileId
        - preview
        - settings
        - updatedAt
      properties:
        version:
          type: string
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProjectFile'
        activeFileId:
          type: string
        preview:
          $ref: '#/components/schemas/PreviewState'
        settings:
          type: object
          properties:
            autosave:
              type: boolean
            linting:
              type: boolean
            showLineNumbers:
              type: boolean
        updatedAt:
          type: integer
          description: Epoch milliseconds
    ProjectFile:
      type: object
      required:
        - id
        - name
        - language
        - content
        - order
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: string
          enum: [tsx, css, json]
        content:
          type: string
        order:
          type: integer
        isReadonly:
          type: boolean
          description: Optional flag for generated helper files.
    PreviewState:
      type: object
      required:
        - viewport
        - zoom
        - theme
      properties:
        viewport:
          type: string
        zoom:
          type: number
        theme:
          type: string
          enum: [light, dark]
        sandboxFlags:
          type: object
          additionalProperties:
            type: boolean
    OversizeError:
      type: object
      required:
        - code
        - message
        - maxAllowedChars
      properties:
        code:
          type: string
          enum: [PAYLOAD_TOO_LARGE]
        message:
          type: string
        maxAllowedChars:
          type: integer
          example: 4000
